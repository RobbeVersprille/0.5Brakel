MEMORY {
    ZP: start = $0000, size = $0100, type = rw, define = yes;
    HEADER:  start = $0000, size = $0010, file = %O;
    PRG:     start = $8000, size = $7FFA, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $FFFA, size = $0006, file = %O;
    CHR:     start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    HEADER:  load = HEADER,  type = ro;
    CODE:    load = PRG,     type = ro;
    VECTORS: load = VECTORS, type = ro;
    CHR:     load = CHR,     type = ro, optional = yes;
}