MEMORY {
    ZP: start = $0000, size = $0100, type = rw, define = yes;
    OAM: start = $0200, size = $0100, type = rw, file = "";
	RAM: start = $0300, size = $0500, type = rw, file = "";
    HEADER:  start = $0000, size = $0010, file = %O;
    PRG:     start = $8000, size = $7FFA, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $FFFA, size = $0006, file = %O;
    CHR0:    start = $0000, size = $1000, file = %O, fill = yes, fillval = $00;
    CHR1:    start = $1000, size = $1000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    OAM: load = OAM, type = bss, align = $100;
    BSS: load = RAM, type = bss;
    HEADER:  load = HEADER,  type = ro;
    CODE:    load = PRG,     type = ro;
    VECTORS: load = VECTORS, type = ro;
    CHR0:    load = CHR0,    type = ro, optional = yes;
    CHR1:    load = CHR1,    type = ro, optional = yes;
}
